<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MegaWorld - Realistic Zombie Survival</title>
<link rel="stylesheet" href="style.css?v=48">
</head>
<body>
<div id="hurtFlash"></div>
<div id="hud">
 <div id="brand"><span id="ppl">👥 -</span><small id="pplsub"></small></div>
 <div id="clock" class="panel"><b id="ctime">08:00</b><small id="cphase"></small></div>
 <div id="health" class="panel">
  <div class="label"><span data-k="vit"></span><b id="hptext">100 / 100</b></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="armor"><div id="afill"></div></div>
  <small id="hpstate"></small>
 </div>
 <div id="stats">
  <div style="display:none"><div><span data-k="zl"></span> <b id="zc">0</b></div>
  <div><span data-k="sl"></span> <b id="score">0</b></div>
  <div><span data-k="cl"></span> <b id="coins">0</b></div>
  <div><span data-k="al"></span> <b id="ammo">-</b></div>
  <div><span data-k="ll"></span> <b id="last">-</b></div></div>
  <button class="corner" id="lang">EN</button><button class="corner" id="info">ℹ️</button><button class="corner" id="invb">🎒</button><button class="corner" id="tmb">👥</button><button class="corner" id="bld">🧱</button><button class="corner" id="snd">🔊</button><button class="corner" id="view">🧍</button><button class="corner" id="mpb">🌐</button><button class="corner" id="cfg">⚙️</button>
 </div>
 <div id="help" class="panel" data-k="help"></div>
 <div id="msg"></div>
</div>
<div id="cross"></div>
<div id="joy"><div id="knob"></div></div>
<button class="tbtn" id="jump">⬆</button>
<button class="tbtn" id="atk">⚔️</button>
<button class="tbtn" id="act">🤚</button>
<button class="tbtn" id="wsw">🔄</button>
<button class="tbtn" id="bmb">🔨</button>
<button class="tbtn" id="rmb">♻️</button>
<div id="inv" class="panel"></div>
<div id="team" class="panel"></div>
<div id="mp" class="panel"></div>
<div id="shop" class="panel"></div>
<div id="wbar"></div>
<div id="bbar"></div>
<div id="hint" class="panel"></div>
<div id="infobox" class="panel" data-k="infotxt"></div>
<div id="menu"><div class="card panel">
 <h1>MEGAWORLD</h1>
 <p data-k="intro"></p>
 <input id="nickname" maxlength="16" value="Spēlētājs">
 <button id="start" data-k="start"></button>
 <p id="mperr" style="font-size:13px;margin-top:12px;color:#ffcf61"></p>
 <p style="font-size:11px;margin-top:16px;color:#5f7689" data-k="net"></p>
</div></div>
<div id="dead"><div class="card panel">
 <h1 data-k="died"></h1>
 <p id="result"></p>
 <div class="btns"><button id="cont" data-k="cont"></button><button id="again" data-k="again"></button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
